    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is a Landlord Gas Safety Record?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A Landlord Gas Safety Record (LGSR, formerly known as a CP12) is a legal document that must be issued by a Gas Safe registered engineer after inspecting gas appliances in a rented property. Landlords are required by law to have gas appliances checked every 12 months."
          }
        },
        {
          "@type": "Question",
          "name": "Is GasPilot free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "GasPilot has a free Starter tier that includes Landlord Gas Safety Records and basic job tracking. The Pro plan (£20/month or £179.99/year) unlocks all 7 gas form types, unlimited customers, invoices and quotes, smart scheduling, team management and renewal reminders. Pro includes a 30-day free trial for new subscribers."
          }
        },
        {
          "@type": "Question",
          "name": "Is GasPilot Gas Safe compliant?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, Gas Safety Records generated through GasPilot meet all legal requirements under the Gas Safety (Installation and Use) Regulations 1998. The app is designed specifically for Gas Safe registered engineers in the UK."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use GasPilot offline?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, GasPilot works without an internet connection. You can create certificates, invoices, and manage jobs on site even with no signal. Your data syncs automatically when you're back online."
          }
        },
        {
          "@type": "Question",
          "name": "Can my team use GasPilot?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Pro includes team management - invite engineers with a unique code, assign jobs, and see everyone's schedule across devices. Perfect for growing gas engineering businesses."
          }
        },
        {
          "@type": "Question",
          "name": "Can I put my company logo on certificates and invoices?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Upload your company logo once and it appears on every certificate, invoice and quote you send - professional branding on every document."
          }
        },
        {
          "@type": "Question",
          "name": "Does GasPilot remind me when gas certificates are due for renewal?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. GasPilot automatically tracks expiry dates on every Gas Safety Record you issue and reminds you before they are due, so you never miss a renewal and your repeat work keeps coming back."
          }
        },
        {
          "@type": "Question",
          "name": "Where can I download GasPilot?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "GasPilot is available on the Apple App Store. Search for 'GasPilot' or visit gaspilotapp.com to find the download link."
          }
        }
      ]
